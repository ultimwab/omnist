<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag the Circle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #333;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            cursor: default;
        }
    </style>
</head>
<body>

    <canvas id="canvas" width="600" height="600"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Center of the canvas
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // Big outer circle configuration
        const bigRadius = 200;

        // Small inner circle configuration
        let smallCircle = {
            x: cx,
            y: cy,
            radius: 30,
            color: '#ff4757',
            isDragging: false
        };

        // Mouse offset from the center of the small circle when clicked
        let offsetX = 0;
        let offsetY = 0;

        function draw() {
            // Clear the canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw the big, unfilled outer circle
            ctx.beginPath();
            ctx.arc(cx, cy, bigRadius, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.closePath();

            // 2. Draw the small, filled inner circle
            ctx.beginPath();
            ctx.arc(smallCircle.x, smallCircle.y, smallCircle.radius, 0, Math.PI * 2);
            ctx.fillStyle = smallCircle.color;
            ctx.fill();
            ctx.closePath();
        }

        // Helper function to get mouse positions relative to canvas
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        // Listen for mouse press down
        canvas.addEventListener('mousedown', function(e) {
            const mouse = getMousePos(e);
            
            // Calculate distance between mouse and small circle center
            const dx = mouse.x - smallCircle.x;
            const dy = mouse.y - smallCircle.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // If the distance is less than the radius, the mouse is inside the small circle
            if (distance < smallCircle.radius) {
                smallCircle.isDragging = true;
                canvas.style.cursor = 'grabbing';
                // Remember exactly where we grabbed it
                offsetX = mouse.x - smallCircle.x;
                offsetY = mouse.y - smallCircle.y;
            }
        });

        // Listen for mouse movement
        canvas.addEventListener('mousemove', function(e) {
            const mouse = getMousePos(e);

            // Check hover style when just moving around
            if (!smallCircle.isDragging) {
                const dx = mouse.x - smallCircle.x;
                const dy = mouse.y - smallCircle.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                canvas.style.cursor = (distance < smallCircle.radius) ? 'pointer' : 'default';
                return;
            }

            // Move the circle directly with the mouse pointer
            smallCircle.x = mouse.x - offsetX;
            smallCircle.y = mouse.y - offsetY;

            draw();
        });

        // Listen for mouse release anywhere on screen
        window.addEventListener('mouseup', function() {
            if (smallCircle.isDragging) {
                smallCircle.isDragging = false;
                canvas.style.cursor = 'pointer';
            }
        });

        // Initial render
        draw();
    </script>
</body>
</html>
